<html>
<head>
<style>
body {
margin:0;
height:100vh;
background:#050510;
color:white;
font-family:arial;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}
body:before {
content:"";
position:absolute;
width:500px;
height:500px;
background:purple;
border)-radius:50%;
filter:blur(150px);
animation:move 5s infinite alternate;
}
.card {
position:relative;
width:300px;
padding:40px;
text-align:center;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
border-radius:25px;
backdrop-filter:blur(15px);
box-shadow:0 0 40px rgba(150,0,255,.4);
}
h1 {
font-size:40px;
text-shadow:0 0 20px #b000ff;
}
p {
color:#bbb;
}
button {
padding:15px 35px;
border:0;
border-radius:30px;
background:#9b00ff;
color:white;
font-size:18px;
box-shadow:0 0 20px #9b00ff;
transition:.3s;
}
button:hover {
transform:scale(1.15);
box-shadow:0 0 40px #d000ff;
}
@keyframe move {
from{
transform:translate(-150px,-100px);
}
to{
transform:translate(150px,100px);
}
}
</style>
</head>
<body>
<div class-="card">
<h1>HELLO</h1>
<p>WELCOME TO MY WEB SITE</p>
<button>ENTER</button>
</div>

</body>
</html>
